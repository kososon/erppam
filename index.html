<style>

table{border-collapse:separate;border-spacing:0;width:100%}th{background:#f1f5f3;color:#51615a;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding:9px 10px;text-align:left;white-space:nowrap}

.b td,tr.b{font-weight:700;background:#f6faf8}
input,select,textarea{font:inherit;padding:8px 11px;border:1px solid #d2dcd6;border-radius:10px;background:#fff;outline:0;transition:.15s}input:focus,select:focus,textarea:focus{border-color:var(--pr);box-shadow:0 0 0 3px rgba(19,121,91,.15)}

button.g{background:#e9f0ec;color:#244036}button.g:hover{background:#dce8e2}button.r{background:#fdeceb;color:#b3261e}button.r:hover{background:#b3261e;color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.ok{color:#0f7a4d;font-weight:600}.bad{color:#b3261e;font-weight:600}
#lg{position:fixed;inset:0;background:linear-gradient(135deg,#0b3a2c,#13654f);display:none;align-items:center;justify-content:center;z-index:99}#lg>div{background:#fff;padding:28px;border-radius:20px;display:flex;flex-direction:column;gap:12px;width:310px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.ov{position:fixed;inset:0;background:rgba(10,30,22,.5);z-index:98;display:grid;place-items:center;backdrop-filter:blur(2px)}.mb{background:#fff;border-radius:18px;padding:22px;width:min(440px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.3)}.mb h3{margin:0 0 10px}.mb input,.mb select{width:100%;margin-bottom:8px}
@media(max-width:800px){body{flex-direction:column}nav{width:100%;height:auto;position:static;flex-direction:row;overflow-x:auto;padding:8px}.brand{display:none}nav a{white-space:nowrap}main{padding:12px}.top{position:static}}
</style></head><body>
<div id="lg"><div><h3 style="margin:0">🌴 ERP Akuntansi Sawit</h3><input id="lu" placeholder="User"><input id="lp" type="password" placeholder="Password" onkeydown="if(event.key=='Enter')login()"><button onclick="login()">Masuk</button><span id="le" class="bad"></span></div></div><nav id="nav"></nav><main><div class="top"><h2 id="ttl"></h2><span id="st" class="k"></span>
<select id="yr" onchange="Y=+this.value;localStorage.y=Y;go(P)"></select><button class="g" onclick="backup()">Backup</button><button class="g" onclick="logout()">Keluar</button></div><div id="c"></div></main>
<script>
const $=id=>document.getElementById(id),fmt=n=>(Math.round((+n||0)*100)/100+0).toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2});
const DEF=[["1110","Kas","d"],["1120","Bank","d"],["1130","Piutang Usaha","d"],["1140","PPh 22 Dibayar Dimuka","d"],["1210","Tanaman Belum Menghasilkan (TBM)","d"],["1220","Tanaman Menghasilkan (TM)","d"],["1310","Tanah","d"],["1320","Bangunan","d"],["1330","Kendaraan","d"],["1340","Peralatan","d"],["1390","Akumulasi Penyusutan","k"],["2110","Hutang Usaha","k"],["2120","Hutang PPN","k"],["3110","Modal Disetor","k"],["3120","Laba Ditahan","k"],["3130","Prive","d"],["4110","Penjualan TBS","k"],["5110","Biaya Pemeliharaan","d"],["5120","Biaya Panen","d"],["6110","Biaya Gaji","d"],["6120","Beban Penyusutan","d"],["6130","Biaya Umum","d"]].map(a=>({kode:a[0],nama:a[1],nm:a[2]}));
let S=JSON.parse(localStorage.pam||'null')||{coa:DEF,sa:{},jr:[],aset:[],pr:{},pb:{},set:{piutang:"1130",pph:"1140",jual:"4110",ppn:"2120",beban:"6120"}};
S.inv=[];S.vd=S.vd||[];S.sub=S.sub||{hutang:{},persediaan:{}};S.map=S.map||{};S.pb=S.pb||{};S.pr=S.pr||{};S.sa=S.sa||{};S.aset=S.aset||[];let Y=+localStorage.y||new Date().getFullYear(),P='dash',db=null,own=false;
const tp=k=>k[0],coaOf=k=>S.coa.find(a=>a.kode==k)||{nama:'?',nm:'d'},sum=a=>a.reduce((x,y)=>x+y,0);
// ===== Firebase (REST) : login + baca data Invoice PAM + simpan data ERP =====
const FB=window.FIREBASE_CONFIG||{};
const fbOn=()=>!!(FB.apiKey&&FB.projectId);
let TOK=null,svT=0,busyS=false,IP={meta:null,entries:[],stamp:0};
const fbEmail=u=>String(u).trim().toLowerCase()+'@'+(FB.emailDomain||'pam-invoice.app');
const fbPw=p=>{p=String(p).toLowerCase();return p.length>=6?p:p+'#'.repeat(6-p.length)};
async function fbPost(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error((j.error&&j.error.message)||'HTTP '+r.status);return j}
function setTok(j,u){TOK={u,id:j.idToken||j.id_token,rt:j.refreshToken||j.refresh_token,exp:Date.now()+(+(j.expiresIn||j.expires_in||3600))*1000};sessionStorage.fbrt=JSON.stringify({u,rt:TOK.rt})}
async function fbLogin(u,p){setTok(await fbPost('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+FB.apiKey,{email:fbEmail(u),password:fbPw(p),returnSecureToken:true}),u)}
function restoreTok(){try{const x=JSON.parse(sessionStorage.fbrt||'null');if(x)TOK={u:x.u,rt:x.rt,id:null,exp:0}}catch(e){}}
async function fbTok(){if(TOK&&TOK.id&&Date.now()<TOK.exp-60000)return TOK.id;setTok(await fbPost('https://securetoken.googleapis.com/v1/token?key='+FB.apiKey,{grant_type:'refresh_token',refresh_token:TOK.rt}),TOK.u);return TOK.id}
const FSU=()=>'https://firestore.googleapis.com/v1/projects/'+FB.projectId+'/databases/(default)/documents/invoice/';
async function fsGet(n){const r=await fetch(FSU()+n,{headers:{Authorization:'Bearer '+await fbTok()}});if(r.status==404)return null;const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error((j.error&&j.error.message)||'HTTP '+r.status);const f=j.fields&&j.fields.json&&j.fields.json.stringValue;return f?JSON.parse(f):null}
async function fsSet(n,obj){const s=JSON.stringify(obj);if(s.length>900000)throw new Error('Data ERP melebihi batas 1 MB dokumen Firestore');const r=await fetch(FSU()+n+'?updateMask.fieldPaths=json',{method:'PATCH',headers:{Authorization:'Bearer '+await fbTok(),'Content-Type':'application/json'},body:JSON.stringify({fields:{json:{stringValue:s}}})});if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error((j.error&&j.error.message)||'HTTP '+r.status)}}
function save(){fixNo();S.at=Date.now();const c={...S,inv:[]};localStorage.pam=JSON.stringify(c);if(TOK){clearTimeout(svT);svT=setTimeout(pushErp,1500);$('st').textContent='● menyimpan…'}}
async function pushErp(){svT=0;try{await fsSet('erp-main',{...S,inv:[]});$('st').textContent='● Online · tersimpan '+new Date().toLocaleTimeString('id-ID')}catch(e){$('st').textContent='Gagal simpan: '+e.message}}
// replika aturan invoicepam: gabung hari berurutan berharga sama, jumlah dibulatkan per baris
function ipRows(es){const dn=s=>{const a=s.split('-').map(Number);return Math.round(Date.UTC(a[0],a[1]-1,a[2])/864e5)},m=new Map();
for(const e of es){const w=Math.round(Number(e.weight)*100)/100,p=Number(e.price);if(!e.date||!(w>0)||!(p>0))continue;const k=e.date+'|'+p;if(!m.has(k))m.set(k,{dn:dn(e.date),price:p,weight:0});m.get(k).weight=Math.round((m.get(k).weight+w)*100)/100}
const l=[...m.values()].sort((a,b)=>a.dn-b.dn||a.price-b.price),rows=[],open=[];
for(const it of l){const r=open.find(x=>x.price===it.price&&x.endN===it.dn-1);if(r){r.endN=it.dn;r.weight=Math.round((r.weight+it.weight)*100)/100}else{const n={price:it.price,weight:it.weight,endN:it.dn};rows.push(n);open.push(n)}}
rows.forEach(r=>r.amount=Math.round(r.weight*r.price+1e-6));return rows}
// 1 invoice = 1 pembeli x 1 bulan ; dpp (field lama) = harga jual sebelum pajak
function buildInv(){const m=IP.meta;if(!m)return;const bs={};(m.buyers||[]).forEach(b=>bs[b.id]=b);const g={};
IP.entries.forEach(e=>{if(!e||!(e.weight>0&&e.price>0)||!bs[e.buyerId])return;const k=e.buyerId+'|'+e.date.slice(0,7);(g[k]=g[k]||[]).push(e)});
S.inv=Object.keys(g).sort().map(k=>{const es=g[k],b=bs[es[0].buyerId],ym=k.split('|')[1],tot=sum(ipRows(es).map(r=>r.amount)),dpp=Math.round(tot*11/12),ppn=Math.round(dpp*0.12),rate=b.pph22?Number(b.pph22Rate)||0:0,pph=Math.round(tot*rate/100),d=(m.docs||{})[k]||{},last=es.map(e=>e.date).sort().pop(),a=ym.split('-').map(Number),end=ym+'-'+String(new Date(Date.UTC(a[0],a[1],0)).getUTCDate()).padStart(2,'0');
return{id:k,noInvoice:d.invoiceNo||('Draft '+b.kode+'/'+ym),tanggal:d.tgl||last||end,pembeli:b.nama,dpp:tot,ppn,pph22:pph}}).filter(i=>i.dpp>0)}
async function syncAll(force){if(!TOK||busyS)return;busyS=true;let ch=!!force;
try{const meta=await fsGet('meta');
if(meta&&(force||(meta.updatedAt||0)!==IP.stamp)){const ys=meta.years||[],parts=await Promise.all(ys.map(y=>fsGet('entries-'+y)));IP={meta,entries:parts.flat().filter(Boolean),stamp:meta.updatedAt||0};buildInv();ch=true}
const erp=await fsGet('erp-main');
if(erp&&(erp.at||0)>(S.at||0)&&!svT){const inv=S.inv;S={...erp,inv};S.vd=S.vd||[];initSub();if(migrateKode())setTimeout(save,0);localStorage.pam=JSON.stringify({...S,inv:[]});ch=true}
else if(!erp&&!svT&&S.at){pushErp()}
$('st').textContent='● Online · sinkron '+new Date().toLocaleTimeString('id-ID');if(ch)go(P)}
catch(e){$('st').textContent='Sinkron gagal: '+e.message}finally{busyS=false}}
// ===== perhitungan =====
const inYear=(t,y)=>(t||'').slice(0,4)==y;
function autoJr(y){return S.inv.filter(i=>inYear(i.tanggal,y)).sort((a,b)=>a.tanggal.localeCompare(b.tanggal)).map(i=>{const d=+i.dpp||0,p=+i.ppn||0,h=+i.pph22||0,id='AUTO-'+i.id;return{id,no:'JP-'+(i.noInvoice||i.id),void:(S.vd||[]).includes(id),tgl:i.tanggal,ket:'Penjualan '+(i.noInvoice||i.id)+' - '+(i.pembeli||''),auto:1,lines:[{k:S.set.piutang,d:d+p-h,c:0},{k:S.set.pph,d:h,c:0},{k:S.set.jual,d:0,c:d},{k:S.set.ppn,d:0,c:p}]}})}
function allJr(y,v){return[...S.jr.filter(j=>inYear(j.tgl,y)),...autoJr(y)].filter(j=>v||!j.void).sort((a,b)=>a.tgl.localeCompare(b.tgl))}
const saOf=(k,y)=>{const r=(S.sa[y]||{})[k]||{};return(+r.d||0)-(+r.k||0)};
const act=(k,y)=>sum(allJr(y).filter(j=>!j.tutup).flatMap(j=>j.lines.filter(l=>l.k==k).map(l=>(+l.d||0)-(+l.c||0))));
const bal=(k,y)=>saOf(k,y)+act(k,y);
const sg=(k,v)=>(tp(k)=='1'||tp(k)>='5'?v:-v);
function codes(){return S.coa.map(a=>a.kode).sort()}
// ===== laporan =====
function rep(kind){const prY=Y-1,imp=S.pr[Y]&&Object.keys(S.pr[Y]).length,src=imp?'impor':'transaksi';
const cur=k=>sg(k,kind=='nr'?bal(k,Y):act(k,Y)),prv=k=>imp?(+S.pr[Y][k]||0):sg(k,kind=='nr'?bal(k,prY):act(k,prY));
const grp=(f)=>S.coa.filter(a=>f(tp(a.kode))).sort((a,b)=>a.kode.localeCompare(b.kode)).map(a=>[a.kode,a.nama,cur(a.kode),prv(a.kode)]);
const tot=(r)=>[sum(r.map(x=>x[2])),sum(r.map(x=>x[3]))];
const lrR=grp(t=>t=='4'),lrB=grp(t=>t=='5'||t=='6'),pen=tot(lrR),bi=tot(lrB),laba=[pen[0]-bi[0],pen[1]-bi[1]];
let rows=[];const sec=(t,r)=>{rows.push([t,'','','',1]);r.forEach(x=>rows.push(x));const s=tot(r);rows.push(['','Total '+t,s[0],s[1],1]);return s};
if(kind=='lr'){sec('PENDAPATAN',lrR);sec('BIAYA',lrB);rows.push(['','LABA (RUGI) BERSIH',laba[0],laba[1],1])}
else if(kind=='nr'){const a=sec('ASET',grp(t=>t=='1')),k=sec('KEWAJIBAN',grp(t=>t=='2')),mr=grp(t=>t=='3');mr.push(['','Laba tahun berjalan',laba[0]*0+(sum(S.coa.filter(a=>tp(a.kode)>3).map(a=>sg(a.kode,act(a.kode,Y))*(tp(a.kode)==4?1:-1)))),imp?0:sum(S.coa.filter(a=>tp(a.kode)>3).map(a=>sg(a.kode,act(a.kode,prY))*(tp(a.kode)==4?1:-1)))]);const m=sec('MODAL',mr);
rows.push(['','TOTAL KEWAJIBAN + MODAL',k[0]+m[0],k[1]+m[1],1]);rows.push(['','Selisih (Aset - Pasiva)',a[0]-k[0]-m[0],a[1]-k[1]-m[1],1])}
else{const mk=y=>sum(S.coa.filter(a=>tp(a.kode)==3).map(a=>-saOf(a.kode,y))),mv=y=>sum(S.coa.filter(a=>tp(a.kode)==3).map(a=>-act(a.kode,y))),lb=y=>sum(S.coa.filter(a=>tp(a.kode)>3).map(a=>-act(a.kode,y)));
const c=[mk(Y),mv(Y),lb(Y)];rows=[['','Modal awal tahun',c[0],'',1],['','Tambah/kurang modal (jurnal akun 3xxx)',c[1],'',1],['','Laba (rugi) tahun berjalan',c[2],'',1],['','MODAL AKHIR',sum(c),'',1]];
S.coa.filter(a=>tp(a.kode)==3).forEach(a=>rows.push([a.kode,a.nama,-bal(a.kode,Y),'']));}
return{rows,src,hasPrev:kind!='pm',title:{lr:'Laporan Laba Rugi',nr:'Neraca',pm:'Laporan Perubahan Modal'}[kind]}}
function repHTML(kind){const r=rep(kind);return`<div class="k">Pembanding tahun lalu: ${r.hasPrev?'dari '+r.src:'-'}</div><table><tr><th>Kode</th><th>Akun</th><th class="n">${Y}</th>${r.hasPrev?`<th class="n">${Y-1}</th>`:''}</tr>${r.rows.map(x=>`<tr class="${x[4]?'b':''}"><td>${x[0]}</td><td>${x[1]}</td><td class="n">${fmt(x[2])}</td>${r.hasPrev?`<td class="n">${fmt(x[3])}</td>`:''}</tr>`).join('')}</table>`}
function expX(k){const r=rep(k),a=[['PT Prima Anugerah Makmur'],[r.title+' '+Y],[],['Kode','Akun',Y,...(r.hasPrev?[Y-1]:[])],...r.rows.map(x=>[x[0],x[1],x[2],...(r.hasPrev?[x[3]]:[])])],w=XLSX.utils.book_new();XLSX.utils.book_append_sheet(w,fz(XLSX.utils.aoa_to_sheet(a)),'Laporan');XLSX.writeFile(w,r.title+' '+Y+'.xlsx')}
function expP(k){const r=rep(k),d=new jspdf.jsPDF({format:'a4',unit:'mm'});d.setFontSize(12);d.text('PT Prima Anugerah Makmur',105,12,{align:'center'});d.text(r.title+' Tahun '+Y,105,18,{align:'center'});
d.autoTable({startY:22,margin:10,head:[['Kode','Akun',String(Y),...(r.hasPrev?[String(Y-1)]:[])]],body:r.rows.map(x=>[x[0],x[1],fmt(x[2]),...(r.hasPrev?[fmt(x[3])]:[])]),styles:{fontSize:8},columnStyles:{2:{halign:'right'},3:{halign:'right'}},didParseCell:h=>{if(h.section=='body'&&r.rows[h.row.index][4])h.cell.styles.fontStyle='bold'}});d.save(r.title+' '+Y+'.pdf')}
// ===== import/template =====
function tpl(n,h,ex){const w=XLSX.utils.book_new();XLSX.utils.book_append_sheet(w,XLSX.utils.aoa_to_sheet([h,...ex]),'Template');XLSX.writeFile(w,n+'.xlsx')}
function imp(e,cb){const f=e.target.files[0];if(!f)return;f.arrayBuffer().then(b=>{const w=XLSX.read(b);cb(XLSX.utils.sheet_to_json(w.Sheets[w.SheetNames[0]],{defval:''}));e.target.value=''})}
function num(v){if(typeof v=='number')return v;let s=String(v||'').trim().replace(/[^0-9.,-]/g,'');if(!s)return 0;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');return +s||0}
function ensureCoa(k,n,nm){k=String(k);if(k&&!S.coa.find(a=>a.kode==k))S.coa.push({kode:k,nama:n||k,nm:nm||'d'})}
// ===== halaman =====
const NAV=[['dash','Dashboard','📊'],['coa','Akun (COA)','📒'],['sa','Saldo Awal','🏁'],['jr','Jurnal','✍️'],['bb','Buku Besar','📚'],['pj','Penjualan','🧾'],['as','Aset Tetap','🏭'],['kap','Kapitalisasi','🔁'],['lap','Laporan','📈'],['set','Pengaturan','⚙️']];
function go(p){P=p;$('nav').innerHTML='<div class="brand"><span>🌴</span><div><b>ERP Sawit</b><small>PT Prima Anugerah Makmur</small></div></div>'+NAV.map(n=>`<a class="${n[0]==p?'on':''}" onclick="go('${n[0]}')"><i>${n[2]}</i>${n[1]}</a>`).join('');$('ttl').textContent=NAV.find(n=>n[0]==p)[1];
$('yr').innerHTML=[Y-3,Y-2,Y-1,Y,Y+1].map(y=>`<option ${y==Y?'selected':''}>${y}</option>`).join('');$('c').innerHTML=PG[p]()}
const opt=(f)=>codes().filter(f||(()=>1)).map(k=>`<option value="${k}">${k} - ${coaOf(k).nama}</option>`).join('');

PG.coa=function(){return`<div class="card"><div class="row"><input id="ckg" size=4 maxlength=3 placeholder="000" oninput="this.value=this.value.replace(/\\D/g,'')"><b>.</b><input id="cks" size=3 maxlength=2 placeholder="00" oninput="this.value=this.value.replace(/\\D/g,'')"><b>.</b><input id="cku" size=4 maxlength=3 placeholder="auto" oninput="this.value=this.value.replace(/\\D/g,'')"><input id="cn" placeholder="Nama akun" size=32><select id="cm"><option value="d">Normal Debit</option><option value="k">Normal Kredit</option></select><button onclick="addCoa()">+ Tambah akun</button></div><div class="k">Format nomor akun <b>000.00.000</b> = kelompok (3 digit) . sub kelompok (2 digit) . nomor urut (3 digit). Nomor urut dikosongkan = otomatis nomor berikutnya. Digit pertama: 1 Aset, 2 Kewajiban, 3 Modal, 4 Pendapatan, 5-6 Biaya.</div></div>
<div class="card"><table><tr><th>No. Akun</th><th>Nama</th><th>Normal</th><th></th></tr>${[...S.coa].sort((a,b)=>a.kode.localeCompare(b.kode)).map(a=>`<tr><td>${a.kode}</td><td>${a.nama}</td><td>${a.nm=='d'?'Debit':'Kredit'}</td><td><button class="g" onclick="editCoa('${a.kode}')">Edit</button> <button class="r" onclick="delCoa('${a.kode}')">Hapus</button></td></tr>`).join('')}</table></div>`};
function addCoa(){const g=$('ckg').value,n=$('cn').value.trim();if(g.length!=3)return alert('Kelompok harus 3 digit');if(!n)return alert('Isi nama akun');const sb=($('cks').value||'0').padStart(2,'0');let u=$('cku').value;if(!u){const us=S.coa.filter(a=>a.kode.startsWith(g+'.'+sb+'.')).map(a=>+a.kode.slice(-3));u=p3((us.length?Math.max(...us):0)+1)}else u=p3(u);const k=g+'.'+sb+'.'+u;if(S.coa.some(a=>a.kode==k))return alert('Nomor akun '+k+' sudah ada');S.coa.push({kode:k,nama:n,nm:$('cm').value});save();go('coa')}
function editCoa(k){const a=S.coa.find(x=>x.kode==k);mdl('Edit akun',`<label class="k">No. Akun (000.00.000)</label><input id="ek" value="${a.kode}" oninput="this.value=maskKode(this.value)"><label class="k">Nama akun</label><input id="en" value="${a.nama.replace(/"/g,'&quot;')}"><label class="k">Saldo normal</label><select id="em"><option value="d" ${a.nm=='d'?'selected':''}>Debit</option><option value="k" ${a.nm=='k'?'selected':''}>Kredit</option></select><div class="k">Mengubah nomor akun otomatis memperbarui semua jurnal, saldo awal, dan pengaturan yang memakai akun ini.</div>`,o=>{const nk=o.querySelector('#ek').value.trim(),nn=o.querySelector('#en').value.trim();if(!KRE.test(nk)){alert('Format nomor akun harus 000.00.000');return false}if(!nn){alert('Nama wajib diisi');return false}if(nk!=k&&S.coa.some(x=>x.kode==nk)){alert('Nomor '+nk+' sudah dipakai akun lain');return false}
if(nk!=k){S.jr.forEach(j=>j.lines.forEach(l=>{if(l.k==k)l.k=nk}));[S.sa,S.pr].forEach(T=>Object.values(T).forEach(y=>{if(y&&k in y){y[nk]=y[k];delete y[k]}}));Object.keys(S.set).forEach(x=>{if(S.set[x]==k)S.set[x]=nk});Object.values(S.map).forEach(m=>{if(m)['a','k','b'].forEach(z=>{if(m[z]==k)m[z]=nk})});if(window.ba==k)window.ba=nk}
a.kode=nk;a.nama=nn;a.nm=o.querySelector('#em').value;save();go('coa')})}
// ---- Jurnal: template, ekspor, impor ----
function jrBar(){return`<div class="card"><div class="row"><b>Excel</b><button class="g" onclick="jrTpl()">Unduh template</button><button class="g" onclick="jrExport()">Ekspor jurnal ${Y}</button><label class="k">Impor: <input type="file" accept=".xlsx,.xls,.csv" onchange="jrImport(event)"></label></div><div class="k">Baris dengan No Trx yang sama menjadi satu jurnal (debit harus sama dengan kredit). No Trx yang sudah ada pada jurnal manual akan menggantikan jurnal itu; selain itu ditambahkan sebagai jurnal baru. Jurnal otomatis penjualan tidak ikut diimpor.</div></div>`}
function jrTpl(){const k1=S.coa[0]?S.coa[0].kode:'111.00.001',k2=S.coa[1]?S.coa[1].kode:'311.00.001',w=XLSX.utils.book_new();
XLSX.utils.book_append_sheet(w,fz(XLSX.utils.aoa_to_sheet([['No Trx','Tanggal','Keterangan','Kode Akun','Debit','Kredit','Pihak/Barang','Qty'],['',Y+'-01-31','Contoh jurnal',k1,1000000,0,'',''],['',Y+'-01-31','Contoh jurnal',k2,0,1000000,'','']])),'Jurnal');
XLSX.utils.book_append_sheet(w,XLSX.utils.aoa_to_sheet([['Kode Akun','Nama Akun','Normal'],...S.coa.map(a=>[a.kode,a.nama,a.nm=='d'?'Debit':'Kredit'])]),'Daftar Akun');
XLSX.utils.book_append_sheet(w,XLSX.utils.aoa_to_sheet([['Petunjuk'],['1. Isi sheet Jurnal. Satu jurnal = beberapa baris dengan No Trx yang sama. No Trx boleh dikosongkan (baris berurutan dengan tanggal dan keterangan sama dianggap satu jurnal; nomor dibuat otomatis).'],['2. Tanggal format YYYY-MM-DD atau DD/MM/YYYY.'],['3. Kode Akun memakai format 000.00.000 (lihat sheet Daftar Akun).'],['4. Pihak/Barang diisi untuk akun piutang (nama pembeli), hutang (nama pemasok), dan persediaan (nama barang). Qty hanya untuk persediaan (debit = masuk, kredit = keluar).'],['5. Hapus 2 baris contoh sebelum mengisi data asli.']]),'Petunjuk');
XLSX.writeFile(w,'Template-Jurnal.xlsx')}
function jrExport(){const rows=[['No Trx','Tanggal','Keterangan','Kode Akun','Nama Akun','Debit','Kredit','Pihak/Barang','Qty','Sumber','Status']];allJr(Y,1).forEach(j=>j.lines.forEach(l=>rows.push([noOf(j),j.tgl,j.ket,l.k,coaOf(l.k).nama,+l.d||0,+l.c||0,l.p||'',l.q||'',j.auto?'Otomatis':j.tutup?'Penutup':'Manual',j.void?'Batal':'Aktif'])));const w=XLSX.utils.book_new();XLSX.utils.book_append_sheet(w,fz(XLSX.utils.aoa_to_sheet(rows)),'Jurnal '+Y);XLSX.writeFile(w,'Jurnal '+Y+'.xlsx')}
function jrImport(e){readSheet(e,/^jurnal/i,rs=>{const G=[],err=[];let cur=null,n=0;rs.forEach((r,i)=>{const sm=String(gv(r,/^sumber/i)).toLowerCase();if(sm=='otomatis'||sm=='penutup')return;const kd=normKode(gv(r,/^kode/i)),d=num(gv(r,/^debit/i)),c=num(gv(r,/^kredit/i));if(!kd&&!d&&!c)return;n++;const no=String(gv(r,/^no/i)).trim(),tg=isoDate(gv(r,/^tanggal|^tgl/i)),ket=String(gv(r,/^ket/i)).trim(),p=String(gv(r,/^pihak|^barang|^pembeli/i)).trim(),q=num(gv(r,/^qty/i)),vd=/batal/i.test(String(gv(r,/^status/i)));
if(!tg)err.push('Baris '+(i+2)+': tanggal tidak valid');if(!S.coa.some(a=>a.kode==kd))err.push('Baris '+(i+2)+': akun "'+kd+'" tidak ditemukan');
if(!cur||(no?no!=cur.no:(cur.no||tg!=cur.tgl||ket!=cur.ket))){cur={no,tgl:tg,ket,void:vd,lines:[]};G.push(cur)}cur.lines.push({k:kd,d,c,p:p||undefined,q:q||undefined})});
G.forEach(j=>{const d=sum(j.lines.map(l=>l.d)),c=sum(j.lines.map(l=>l.c));if(Math.abs(d-c)>=0.005)err.push('Jurnal '+(j.no||j.ket||j.tgl)+': debit '+fmt(d)+' tidak sama dengan kredit '+fmt(c))});
mdl('Impor jurnal',`<p style="margin:0 0 8px"><b>${G.length}</b> jurnal (${n} baris) terbaca.</p>${err.length?`<div class="bad" style="max-height:180px;overflow:auto">${err.slice(0,15).map(x=>'• '+x).join('<br>')}${err.length>15?'<br>…':''}</div><div class="k">Perbaiki file lalu impor ulang.</div>`:'<div class="ok">Semua data valid.</div>'}`,err.length||!G.length?null:()=>{let add=0,upd=0;G.forEach((j,i)=>{const ex=j.no&&S.jr.find(x=>x.no==j.no);if(ex){ex.tgl=j.tgl;ex.ket=j.ket;ex.lines=j.lines;ex.void=j.void||undefined;upd++}else{S.jr.push({id:'J'+Date.now()+i,no:j.no&&!S.jr.some(x=>x.no==j.no)?j.no:nextNo(j.tgl.slice(0,4)),tgl:j.tgl,ket:j.ket,lines:j.lines,void:j.void||undefined});add++}});save();go('jr');alert('Selesai: '+add+' jurnal baru, '+upd+' diganti.')},'Impor')})}
const _jr3=PG.jr;PG.jr=()=>jrBar()+_jr3();
// ---- Buku besar pembantu hutang & persediaan ----
const SUBC={hutang:{t:'Hutang Usaha',pihak:'Pemasok',nat:-1},persediaan:{t:'Persediaan',pihak:'Barang / item',nat:1}};
const subAcc=kd=>S.set[kd]||'',subOpen=(kd,y)=>(S.sub&&S.sub[kd]&&S.sub[kd][y])||{};
function subLines(kd,y){const k=subAcc(kd),r=[];S.jr.filter(j=>!j.void&&inYear(j.tgl,y)).forEach(j=>j.lines.forEach(l=>{if(l.k==k)r.push({tgl:j.tgl,no:noOf(j),ket:j.ket,p:l.p||'(Tanpa nama)',d:+l.d||0,c:+l.c||0,q:+l.q||0})}));return r.sort((a,b)=>a.tgl.localeCompare(b.tgl))}
const subParties=(kd,y)=>[...new Set([...Object.keys(subOpen(kd,y)),...subLines(kd,y).map(x=>x.p)])].sort();
const qd=x=>x.q?(x.d>=x.c?x.q:-x.q):0;
function subSummary(kd,y){const nat=SUBC[kd].nat,L=subLines(kd,y),o=subOpen(kd,y);return subParties(kd,y).map(p=>{const op=+(o[p]||{}).v||0,oq=+(o[p]||{}).q||0,ls=L.filter(x=>x.p==p),D=sum(ls.map(x=>x.d)),K=sum(ls.map(x=>x.c));return{p,op,D,C:K,end:op+nat*(D-K),q:oq+sum(ls.map(qd))}})}
function subEnd(kd,y){const r={};subSummary(kd,y).forEach(x=>{r[x.p]={v:x.end,q:x.q}});return r}
function subLedger(kd,y,p){const nat=SUBC[kd].nat,o=subOpen(kd,y)[p]||{};let s=+o.v||0,q=+o.q||0;const rows=[['','','Saldo awal',0,0,s,q]];subLines(kd,y).filter(x=>x.p==p).forEach(x=>{s+=nat*(x.d-x.c);q+=qd(x);rows.push([x.tgl,x.no,x.ket,x.d,x.c,s,q])});return rows}
function subCard(kd){const C=SUBC[kd],k=subAcc(kd),pq=kd=='persediaan';if(!k)return`<div class="card"><b>Buku besar pembantu ${C.t}</b><div class="k">Pilih akun ${C.t} di menu Pengaturan terlebih dulu.</div></div>`;
window.sp=window.sp||{};const ps=subParties(kd,Y),cur=ps.includes(window.sp[kd])?window.sp[kd]:ps[0],sm=subSummary(kd,Y),tot=sum(sm.map(x=>x.end)),gl=C.nat*bal(k,Y),ok=Math.abs(tot-gl)<=1,lg=cur?subLedger(kd,Y,cur):[];
return`<div class="card"><b>Buku besar pembantu ${C.t}</b> <span class="k">${k} - ${coaOf(k).nama}</span><div class="row" style="margin-top:8px"><button class="g" onclick="expSub('${kd}','x')">Excel</button><button class="g" onclick="expSub('${kd}','p')">PDF</button></div>
<table><tr><th>${C.pihak}</th><th class="n">Saldo awal</th><th class="n">Debit</th><th class="n">Kredit</th><th class="n">Saldo akhir</th>${pq?'<th class="n">Qty akhir</th>':''}</tr>${sm.map(x=>`<tr><td>${x.p}</td><td class="n">${fmt(x.op)}</td><td class="n">${fmt(x.D)}</td><td class="n">${fmt(x.C)}</td><td class="n">${fmt(x.end)}</td>${pq?`<td class="n">${fmt(x.q)}</td>`:''}</tr>`).join('')||'<tr><td colspan=6 class="k">Belum ada data. Isi kolom Pihak/Barang pada baris jurnal akun ini, atau saldo awal di menu Saldo Awal.</td></tr>'}<tr class="b"><td>Total</td><td class="n">${fmt(sum(sm.map(x=>x.op)))}</td><td class="n">${fmt(sum(sm.map(x=>x.D)))}</td><td class="n">${fmt(sum(sm.map(x=>x.C)))}</td><td class="n">${fmt(tot)}</td>${pq?'<td></td>':''}</tr></table>
<div class="${ok?'ok':'bad'}" style="margin-top:8px">Saldo akun di buku besar ${fmt(gl)} · ${ok?'COCOK (toleransi ±1)':'Selisih '+fmt(tot-gl)}</div>
${cur?`<div class="row" style="margin-top:14px"><b>Rincian:</b><select onchange="sp['${kd}']=this.value;go('bb')">${ps.map(p=>`<option ${p==cur?'selected':''}>${p}</option>`).join('')}</select></div><table><tr><th>Tgl</th><th>No Trx</th><th>Ket</th><th class="n">Debit</th><th class="n">Kredit</th><th class="n">Saldo</th>${pq?'<th class="n">Qty</th>':''}</tr>${lg.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td class="n">${fmt(x[3])}</td><td class="n">${fmt(x[4])}</td><td class="n">${fmt(x[5])}</td>${pq?`<td class="n">${fmt(x[6])}</td>`:''}</tr>`).join('')}</table>`:''}</div>`}
function expSub(kd,m){const C=SUBC[kd],pq=kd=='persediaan',sm=subSummary(kd,Y),cur=(window.sp||{})[kd]||(sm[0]&&sm[0].p),hd=['Pihak','Saldo awal','Debit','Kredit','Saldo akhir'].concat(pq?['Qty akhir']:[]),rw=sm.map(x=>[x.p,x.op,x.D,x.C,x.end].concat(pq?[x.q]:[]));
if(m=='x'){const w=XLSX.utils.book_new();XLSX.utils.book_append_sheet(w,fz(XLSX.utils.aoa_to_sheet([hd,...rw])),'Ringkasan');const al=[['Pihak','Tgl','No Trx','Keterangan','Debit','Kredit','Saldo','Qty']];subParties(kd,Y).forEach(p=>subLedger(kd,Y,p).forEach(x=>al.push([p,...x])));XLSX.utils.book_append_sheet(w,fz(XLSX.utils.aoa_to_sheet(al)),'Rincian');XLSX.writeFile(w,'BB Pembantu '+C.t+' '+Y+'.xlsx');return}
const d=new jspdf.jsPDF({format:'a4',unit:'mm'});d.setFontSize(12);d.text('PT Prima Anugerah Makmur',105,12,{align:'center'});d.text('Buku Besar Pembantu '+C.t+' Tahun '+Y,105,18,{align:'center'});
const nf=a=>a.map((v,i)=>i?fmt(v):v);d.autoTable({startY:22,margin:{top:10,left:10,right:10,bottom:12},head:[hd],body:rw.map(nf),styles:{fontSize:8},columnStyles:{1:{halign:'right'},2:{halign:'right'},3:{halign:'right'},4:{halign:'right'},5:{halign:'right'}}});
if(cur){d.setFontSize(10);d.text(C.pihak+': '+cur,10,d.lastAutoTable.finalY+8);d.autoTable({startY:d.lastAutoTable.finalY+11,margin:{top:10,left:10,right:10,bottom:12},head:[['Tgl','No Trx','Keterangan','Debit','Kredit','Saldo'].concat(pq?['Qty']:[])],body:subLedger(kd,Y,cur).map(x=>[x[0],x[1],x[2],fmt(x[3]),fmt(x[4]),fmt(x[5])].concat(pq?[fmt(x[6])]:[])),styles:{fontSize:8},columnStyles:{3:{halign:'right'},4:{halign:'right'},5:{halign:'right'},6:{halign:'right'}}})}
const n=d.getNumberOfPages();for(let i=1;i<=n;i++){d.setPage(i);d.setFontSize(8);d.text(i+'/'+n,105,291,{align:'center'})}d.save('BB Pembantu '+C.t+' '+Y+'.pdf')}
const _bb3=PG.bb;PG.bb=()=>_bb3()+subCard('hutang')+subCard('persediaan');
function svSub(kd,n,f,v){S.sub[kd][Y]=S.sub[kd][Y]||{};const o=S.sub[kd][Y];o[n]=o[n]||{v:0,q:0};o[n][f]=num(v);save();go('sa')}
function addSub(kd){const n=$('sn_'+kd).value.trim();if(!n)return alert('Isi nama');svSub(kd,n,'v',$('sv_'+kd).value);if(kd=='persediaan')svSub(kd,n,'q',$('sq_'+kd).value)}
function delSub(kd,n){konfirm('Hapus saldo awal <b>'+n+'</b>?',()=>{delete S.sub[kd][Y][n];save();go('sa')})}
function subSaldoHTML(kd){const C=SUBC[kd],k=subAcc(kd),pq=kd=='persediaan';if(!k)return'';const o=subOpen(kd,Y),tot=sum(Object.values(o).map(x=>+x.v||0)),gl=C.nat*saOf(k,Y),ok=Math.abs(tot-gl)<=1;
return`<div class="card"><b>Saldo awal ${C.t} per ${C.pihak.toLowerCase()} ${Y}</b> <span class="k">${k} - ${coaOf(k).nama}</span><div class="row" style="margin-top:8px"><input id="sn_${kd}" placeholder="${C.pihak}" size=26><input id="sv_${kd}" placeholder="Nilai" size=14>${pq?`<input id="sq_${kd}" placeholder="Qty" size=8>`:''}<button onclick="addSub('${kd}')">Simpan</button></div><table>${Object.entries(o).map(([n,x])=>`<tr><td>${n}</td><td><input size=14 value="${fmt(x.v)}" onchange="svSub('${kd}',${qa(n)},'v',this.value)"></td>${pq?`<td><input size=8 value="${fmt(x.q)}" onchange="svSub('${kd}',${qa(n)},'q',this.value)"></td>`:''}<td><button class="r" onclick="delSub('${kd}',${qa(n)})">Hapus</button></td></tr>`).join('')}</table><div class="${ok?'ok':'bad'}">Total rincian ${fmt(tot)} vs saldo awal akun ${fmt(gl)} · ${ok?'COCOK (toleransi ±1)':'Selisih '+fmt(tot-gl)}</div></div>`}
const _sa3=PG.sa;PG.sa=()=>_sa3()+subSaldoHTML('hutang')+subSaldoHTML('persediaan');
const _set3=PG.set;PG.set=()=>_set3()+`<div class="card"><b>Akun buku besar pembantu</b><div class="row" style="margin-top:8px"><label>Hutang usaha <select onchange="S.set.hutang=this.value;save()">${selOpt(k=>tp(k)=='2',S.set.hutang||'')}</select></label><label>Persediaan <select onchange="S.set.persediaan=this.value;save()">${selOpt(k=>tp(k)=='1',S.set.persediaan||'')}</select></label></div><div class="k">Isi kolom Pihak/Barang (dan Qty untuk persediaan) pada baris jurnal akun tersebut.</div></div>`;
function lanjut(){if(!S.jr.find(j=>j.id=='TUTUP-'+Y&&!j.void))return alert('Buat jurnal penutup '+Y+' dulu');
if(S.coa.some(a=>tp(a.kode)>3&&Math.round(balT(a.kode,Y)))&&!confirm('Masih ada akun laba rugi bersaldo (ada transaksi setelah penutup). Sebaiknya buat ulang jurnal penutup. Lanjut tetap?'))return;
if(S.sa[Y+1]&&Object.keys(S.sa[Y+1]).length&&!confirm('Saldo awal '+(Y+1)+' sudah ada. Timpa?'))return;
const n={};S.coa.filter(a=>tp(a.kode)<=3).forEach(a=>{const v=Math.round(balT(a.kode,Y)*100)/100;if(v)n[a.kode]={d:v>0?v:0,k:v<0?-v:0}});S.sa[Y+1]=n;S.pb[Y+1]=pbEnd(Y);
['hutang','persediaan'].forEach(kd=>{const e=subEnd(kd,Y),o={};Object.keys(e).forEach(p=>{if(Math.round(e[p].v*100)||e[p].q)o[p]={v:e[p].v,q:e[p].q}});S.sub[kd][Y+1]=o});
save();alert('Saldo awal '+(Y+1)+' dibuat dari saldo akhir '+Y+' (akun neraca, piutang, hutang, dan persediaan per pihak).');Y=Y+1;localStorage.y=Y;go('sa')}

function asetRekon(y){const A={},K={},un=new Set(),ay=S.set.asetY||y;S.aset.filter(a=>!a.off&&((+String(a.tgl||'').slice(0,4)||0)<y||(y==ay&&!a.man&&!/^KAP/.test(a.kode)))).forEach(a=>{const m=S.map[a.kelompok]||{};if(m.a)A[m.a]=(A[m.a]||0)+a.harga;else un.add(a.kelompok);if(m.k)K[m.k]=(K[m.k]||0)+akumAwal(a,y);else un.add(a.kelompok)});const rows=[];Object.keys(A).forEach(k=>rows.push({k,t:'Harga perolehan',r:A[k],s:saOf(k,y)}));Object.keys(K).forEach(k=>rows.push({k,t:'Akumulasi penyusutan',r:K[k],s:-saOf(k,y)}));return{rows,un:[...un]}}
function peny(){const g={};S.aset.forEach(a=>{if(a.off)return;const m=S.map[a.kelompok]||{},v=dep(a);if(!v||!m.k)return;const b=m.b||S.set.beban,key=b+'|'+m.k;g[key]=(g[key]||0)+v});const l=[];Object.entries(g).forEach(([key,v])=>{const z=key.split('|');l.push({k:z[0],d:Math.round(v*100)/100,c:0},{k:z[1],d:0,c:Math.round(v*100)/100})});if(!l.length)return alert('Pilih akun akumulasi per kelompok dulu');S.jr=S.jr.filter(j=>j.id!='PNY-'+Y);S.jr.push({id:'PNY-'+Y,tgl:Y+'-12-31',ket:'Penyusutan aset tahun '+Y,lines:l});save();alert('Jurnal penyusutan dibuat/diperbarui');go('as')}
PG.as=function(){const gs=[...new Set(S.aset.map(a=>a.kelompok))];
return asetRekonHTML()+`<div class="card"><div class="row"><button onclick="asetForm()">+ Tambah aset</button><button class="g" onclick="asetTpl()">Unduh template</button><label class="k">Impor Excel: <input type="file" accept=".xlsx,.xls,.csv" onchange="asetImport(event)"></label><button class="g" onclick="peny()">Proses penyusutan ${Y}</button></div><div class="k">Impor menambah aset baru atau memperbarui aset dengan kode yang sama (aset lain tidak dihapus). Tambah aset tidak membuat jurnal pembelian; untuk aset yang dibeli tahun berjalan catat lewat Jurnal atau Kapitalisasi.</div></div>
<div class="card"><b>Akun per kelompok aset</b><table><tr><th>Kelompok</th><th>Akun aset</th><th>Akun akumulasi</th><th>Akun beban penyusutan</th></tr>${gs.map(g=>{const m=S.map[g]||{},q=qa(g);return`<tr><td>${g}</td><td><select onchange="setMap(${q},'a',this.value)">${selOpt(k=>tp(k)=='1',m.a||'')}</select></td><td><select onchange="setMap(${q},'k',this.value)">${selOpt(k=>tp(k)=='1',m.k||'')}</select></td><td><select onchange="setMap(${q},'b',this.value)">${selOpt(k=>tp(k)>='5',m.b||S.set.beban||'')}</select></td></tr>`}).join('')||'<tr><td colspan=4 class="k">Belum ada aset.</td></tr>'}</table></div>
<div class="card"><table><tr><th>Kode</th><th>Nama</th><th>Kelompok</th><th>Tgl</th><th class="n">Harga</th><th class="n">Peny. ${Y}</th><th class="n">Akum akhir</th><th class="n">Nilai buku</th><th></th></tr>${S.aset.filter(a=>!a.off).map(a=>{const p=dep(a);return`<tr><td>${a.kode}</td><td>${a.nama}</td><td>${a.kelompok}</td><td>${a.tgl||''}</td><td class="n">${fmt(a.harga)}</td><td class="n">${fmt(p)}</td><td class="n">${fmt(akumAwal(a,Y)+p)}</td><td class="n">${fmt(a.harga-akumAwal(a,Y)-p)}</td><td><button class="g" onclick="asetForm(${qa(a.kode)})">Edit</button> <button class="r" onclick="delAset(${qa(a.kode)})">Hapus</button></td></tr>`}).join('')}</table></div>`};
function setMap(g,f,v){S.map[g]=S.map[g]||{};S.map[g][f]=v;save();go('as')}
function delAset(k){konfirm('Hapus aset <b>'+k+'</b> dari daftar? Jurnal yang sudah ada tidak ikut terhapus.',()=>{S.aset=S.aset.filter(a=>a.kode!=k);save();go('as')})}
function asetPre(g){const m=S.map[g];if(!m)return;[['fa','a'],['fk','k'],['fb','b']].forEach(([i,f])=>{if(m[f])document.getElementById(i).value=m[f]})}
function asetForm(kd){const a=kd?S.aset.find(x=>x.kode==kd):null,nx=Math.max(0,...S.aset.map(x=>/^A\d+$/.test(x.kode)?+x.kode.slice(1):0))+1,o=a||{kode:'A'+String(nx).padStart(3,'0'),nama:'',kelompok:'',tgl:Y+'-01-01',harga:0,umur:8,akum:0},m=S.map[o.kelompok]||{};
mdl(a?'Edit aset':'Tambah aset',`<label class="k">Kode aset</label><input id="fkd" value="${o.kode}"><label class="k">Nama aset</label><input id="fn" value="${String(o.nama).replace(/"/g,'&quot;')}"><label class="k">Kelompok aset</label><input id="fg" list="gl" value="${String(o.kelompok).replace(/"/g,'&quot;')}" onchange="asetPre(this.value)"><datalist id="gl">${[...new Set(S.aset.map(x=>x.kelompok))].map(g=>`<option value="${g}">`).join('')}</datalist><label class="k">Tanggal perolehan</label><input id="ft" type="date" value="${o.tgl||''}"><label class="k">Harga perolehan</label><input id="fh" value="${fmt(o.harga)}" onchange="this.value=fmt(num(this.value))"><label class="k">Umur ekonomis (tahun)</label><input id="fu" value="${o.umur}"><label class="k">Akumulasi penyusutan awal</label><input id="fa0" value="${fmt(o.akum)}" onchange="this.value=fmt(num(this.value))"><label class="k">Akun aset</label><select id="fa">${selOpt(k=>tp(k)=='1',m.a||'')}</select><label class="k">Akun akumulasi penyusutan</label><select id="fk">${selOpt(k=>tp(k)=='1',m.k||'')}</select><label class="k">Akun beban penyusutan</label><select id="fb">${selOpt(k=>tp(k)>='5',m.b||S.set.beban||'')}</select><div class="k">Akun mengikuti kelompok: mengubahnya berlaku untuk semua aset dalam kelompok yang sama.</div>`,o2=>{const q=s=>o2.querySelector(s).value,kode=q('#fkd').trim(),nama=q('#fn').trim(),kel=q('#fg').trim(),tgl=isoDate(q('#ft')),h=num(q('#fh')),um=num(q('#fu')),ak=num(q('#fa0')),A=q('#fa'),K=q('#fk'),B=q('#fb');
if(!kode||!nama||!kel){alert('Kode, nama, dan kelompok wajib diisi');return false}if(!tgl){alert('Tanggal perolehan tidak valid');return false}if(!(h>0)||!(um>0)){alert('Harga dan umur harus lebih dari 0');return false}if(!A||!K||!B){alert('Pilih akun aset, akumulasi, dan beban penyusutan');return false}if(kode!=(a&&a.kode)&&S.aset.some(x=>x.kode==kode)){alert('Kode aset sudah dipakai');return false}
const z={kode,nama,kelompok:kel,tgl,harga:h,umur:um,akum:ak};if(a)Object.assign(a,z);else S.aset.push(Object.assign(z,{man:true}));S.map[kel]={a:A,k:K,b:B};save();go('as')})}
function asetTpl(){const w=XLSX.utils.book_new(),aa=S.coa.find(x=>tp(x.kode)=='1'&&!/akum/i.test(x.nama)),ak=S.coa.find(x=>/akum/i.test(x.nama));
XLSX.utils.book_append_sheet(w,fz(XLSX.utils.aoa_to_sheet([['kode','nama','kelompok','tgl_perolehan','harga','umur_tahun','akum_awal','akun_aset','akun_akum','akun_beban'],['A001','Traktor','Kendaraan','2020-03-01',250000000,8,50000000,aa?aa.kode:'',ak?ak.kode:'',S.set.beban||'']])),'Aset');
XLSX.utils.book_append_sheet(w,XLSX.utils.aoa_to_sheet([['Petunjuk'],['kode: unik; jika sudah ada akan diperbarui. Kosongkan = dibuat otomatis.'],['tgl_perolehan: YYYY-MM-DD atau DD/MM/YYYY. akum_awal = akumulasi penyusutan awal tahun saldo awal.'],['akun_aset, akun_akum, akun_beban (opsional): nomor akun 000.00.000, menentukan akun untuk kelompok tersebut. Bila kosong, pilih di menu Aset Tetap.']]),'Petunjuk');
XLSX.utils.book_append_sheet(w,XLSX.utils.aoa_to_sheet([['Kode Akun','Nama Akun'],...S.coa.map(a=>[a.kode,a.nama])]),'Daftar Akun');XLSX.writeFile(w,'Template-Aset.xlsx')}
function asetImport(e){readSheet(e,/aset/i,rs=>{let add=0,upd=0;const err=[];let nx=Math.max(0,...S.aset.map(x=>/^A\d+$/.test(x.kode)?+x.kode.slice(1):0));rs.forEach((x,i)=>{const nm=String(gv(x,/^nama/i)).trim(),kel=String(gv(x,/^kelompok/i)).trim(),h=num(gv(x,/^harga/i));if(!nm&&!h)return;const tgl=isoDate(gv(x,/^tgl/i));if(!nm||!kel||!(h>0)||!tgl){err.push('Baris '+(i+2)+': nama, kelompok, tanggal, atau harga tidak valid');return}
let kd=String(gv(x,/^kode/i)).trim();if(!kd)kd='A'+String(++nx).padStart(3,'0');const z={kode:kd,nama:nm,kelompok:kel,tgl,harga:h,umur:num(gv(x,/^umur/i))||1,akum:num(gv(x,/^akum_awal|^akum awal/i))},ex=S.aset.find(a=>a.kode==kd);if(ex){Object.assign(ex,z);upd++}else{S.aset.push(Object.assign(z,{imp:true}));add++}
const A=normKode(gv(x,/^akun_aset/i)),K=normKode(gv(x,/^akun_akum/i)),B=normKode(gv(x,/^akun_beban/i));if(A||K||B){S.map[kel]=S.map[kel]||{};[['a',A],['k',K],['b',B]].forEach(([f,v])=>{if(!v)return;if(S.coa.some(c=>c.kode==v))S.map[kel][f]=v;else err.push('Baris '+(i+2)+': akun '+v+' tidak ditemukan')})}});
if(!S.set.asetY)S.set.asetY=Y;save();go('as');mdl('Hasil impor aset',`<p style="margin:0">${add} aset baru, ${upd} diperbarui.</p>${err.length?`<div class="bad" style="margin-top:8px">${err.slice(0,12).map(t=>'• '+t).join('<br>')}</div>`:''}`)})}
initSub();if(migrateKode())localStorage.pam=JSON.stringify({...S,inv:[]});
if(sessionStorage.ok){$('lg').style.display='none';boot()}else $('lg').style.display='flex';
</script></body></html>
