<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ERP Akuntansi Sawit</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1f2933;--mu:#6b7785;--pr:#1b6b4a;--bd:#dde3e8}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;min-height:100vh}
nav{width:210px;background:#12382a;color:#fff;padding:12px 0;flex-shrink:0}nav h1{font-size:15px;padding:0 16px 10px;margin:0}
nav a{display:block;padding:9px 16px;color:#cfe3d9;cursor:pointer}nav a.on,nav a:hover{background:#1b6b4a;color:#fff}
main{flex:1;padding:16px;min-width:0}.top{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.top h2{margin:0;flex:1}.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:12px;overflow-x:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.k{font-size:12px;color:var(--mu)}.v{font-size:19px;font-weight:600}
table{border-collapse:collapse;width:100%}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{background:#eef2f5}td.n,th.n{text-align:right}
input,select,button{font:inherit;padding:6px 8px;border:1px solid var(--bd);border-radius:6px}button{background:var(--pr);color:#fff;border:0;cursor:pointer}button.g{background:#e6ebef;color:var(--tx)}button.r{background:#b3261e}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}.ok{color:#1b6b4a}.bad{color:#b3261e}.b{font-weight:700;background:#f7f9fa}
@media(max-width:700px){body{flex-direction:column}nav{width:100%;display:flex;overflow-x:auto}nav h1{display:none}}
#lg{position:fixed;inset:0;background:#12382a;display:none;align-items:center;justify-content:center;z-index:9}#lg div{background:#fff;padding:24px;border-radius:10px;display:flex;flex-direction:column;gap:10px;width:280px}
</style></head><body>
<div id="lg"><div><h3 style="margin:0">🌴 ERP Akuntansi Sawit</h3><input id="lu" placeholder="User"><input id="lp" type="password" placeholder="Password" onkeydown="if(event.key=='Enter')login()"><button onclick="login()">Masuk</button><span id="le" class="bad"></span></div></div><nav id="nav"></nav><main><div class="top"><h2 id="ttl"></h2><span id="st" class="k"></span>
<select id="yr" onchange="Y=+this.value;localStorage.y=Y;go(P)"></select><button class="g" onclick="backup()">Backup</button><button class="g" onclick="logout()">Keluar</button></div><div id="c"></div></main>
<script>
const $=id=>document.getElementById(id),fmt=n=>(Math.round(n||0)).toLocaleString('id-ID');
const DEF=[["1110","Kas","d"],["1120","Bank","d"],["1130","Piutang Usaha","d"],["1140","PPh 22 Dibayar Dimuka","d"],["1210","Tanaman Belum Menghasilkan (TBM)","d"],["1220","Tanaman Menghasilkan (TM)","d"],["1310","Tanah","d"],["1320","Bangunan","d"],["1330","Kendaraan","d"],["1340","Peralatan","d"],["1390","Akumulasi Penyusutan","k"],["2110","Hutang Usaha","k"],["2120","Hutang PPN","k"],["3110","Modal Disetor","k"],["3120","Laba Ditahan","k"],["3130","Prive","d"],["4110","Penjualan TBS","k"],["5110","Biaya Pemeliharaan","d"],["5120","Biaya Panen","d"],["6110","Biaya Gaji","d"],["6120","Beban Penyusutan","d"],["6130","Biaya Umum","d"]].map(a=>({kode:a[0],nama:a[1],nm:a[2]}));
let S=JSON.parse(localStorage.pam||'null')||{coa:DEF,sa:{},jr:[],aset:[],pr:{},pb:{},set:{piutang:"1130",pph:"1140",jual:"4110",ppn:"2120",beban:"6120"}};
S.inv=[];S.vd=S.vd||[];let Y=+localStorage.y||new Date().getFullYear(),P='dash',db=null,own=false;
const tp=k=>k[0],coaOf=k=>S.coa.find(a=>a.kode==k)||{nama:'?',nm:'d'},sum=a=>a.reduce((x,y)=>x+y,0);
function save(){fixNo();const c={...S,inv:[]};localStorage.pam=JSON.stringify(c);if(db){own=true;db.collection('pam').doc('main').set({data:JSON.stringify(c)}).catch(e=>$('st').textContent='Gagal simpan: '+e.message)}}
function connect(){const cfg=JSON.parse(localStorage.fbcfg||'null');if(!cfg||!window.firebase)return;try{firebase.initializeApp(cfg);db=firebase.firestore();
db.collection('pam').doc('main').onSnapshot(d=>{if(d.metadata.hasPendingWrites)return;if(d.exists){const x=JSON.parse(d.data().data);S={...x,inv:S.inv};localStorage.pam=JSON.stringify({...S,inv:[]});go(P)}});
db.collection('invoices').onSnapshot(q=>{S.inv=q.docs.map(d=>({id:d.id,...d.data()}));go(P)});$('st').textContent='● Online (realtime)'}catch(e){$('st').textContent='Firebase error: '+e.message}}
// ===== perhitungan =====
const inYear=(t,y)=>(t||'').slice(0,4)==y;
function autoJr(y){return S.inv.filter(i=>inYear(i.tanggal,y)).sort((a,b)=>a.tanggal.localeCompare(b.tanggal)).map(i=>{const d=+i.dpp||0,p=+i.ppn||0,h=+i.pph22||0,id='AUTO-'+i.id;return{id,no:'JP-'+(i.noInvoice||i.id),void:(S.vd||[]).includes(id),tgl:i.tanggal,ket:'Penjualan '+(i.noInvoice||i.id)+' - '+(i.pembeli||''),auto:1,lines:[{k:S.set.piutang,d:d+p-h,c:0},{k:S.set.pph,d:h,c:0},{k:S.set.jual,d:0,c:d},{k:S.set.ppn,d:0,c:p}]}})}
function allJr(y,v){return[...S.jr.filter(j=>inYear(j.tgl,y)),...autoJr(y)].filter(j=>v||!j.void).sort((a,b)=>a.tgl.localeCompare(b.tgl))}
const saOf=(k,y)=>{const r=(S.sa[y]||{})[k]||{};return(+r.d||0)-(+r.k||0)};
const act=(k,y)=>sum(allJr(y).filter(j=>!j.tutup).flatMap(j=>j.lines.filter(l=>l.k==k).map(l=>(+l.d||0)-(+l.c||0))));
const bal=(k,y)=>saOf(k,y)+act(k,y);
const sg=(k,v)=>coaOf(k).nm=='d'?v:-v;
function codes(){return S.coa.map(a=>a.kode).sort()}
// ===== laporan =====
function rep(kind){const prY=Y-1,imp=S.pr[Y]&&Object.keys(S.pr[Y]).length,src=imp?'impor':'transaksi';
const cur=k=>sg(k,kind=='nr'?bal(k,Y):act(k,Y)),prv=k=>imp?(+S.pr[Y][k]||0):sg(k,kind=='nr'?bal(k,prY):act(k,prY));
const grp=(f)=>S.coa.filter(a=>f(tp(a.kode))).sort((a,b)=>a.kode.localeCompare(b.kode)).map(a=>[a.kode,a.nama,cur(a.kode),prv(a.kode)]);
const tot=(r)=>[sum(r.map(x=>x[2])),sum(r.map(x=>x[3]))];
const lrR=grp(t=>t=='4'),lrB=grp(t=>t=='5'||t=='6'),pen=tot(lrR),bi=tot(lrB),laba=[pen[0]-bi[0],pen[1]-bi[1]];
let rows=[];const sec=(t,r)=>{rows.push([t,'','','',1]);r.forEach(x=>rows.push(x));const s=tot(r);rows.push(['','Total '+t,s[0],s[1],1]);return s};
if(kind=='lr'){sec('PENDAPATAN',lrR);sec('BIAYA',lrB);rows.push(['','LABA (RUGI) BERSIH',laba[0],laba[1],1])}
else if(kind=='nr'){const a=sec('ASET',grp(t=>t=='1')),k=sec('KEWAJIBAN',grp(t=>t=='2')),mr=grp(t=>t=='3');mr.push(['','Laba tahun berjalan',laba[0]*0+(sum(S.coa.filter(a=>tp(a.kode)>3).map(a=>sg(a.kode,act(a.kode,Y))*(tp(a.kode)==4?1:-1)))),imp?0:sum(S.coa.filter(a=>tp(a.kode)>3).map(a=>sg(a.kode,act(a.kode,prY))*(tp(a.kode)==4?1:-1)))]);const m=sec('MODAL',mr);
rows.push(['','TOTAL KEWAJIBAN + MODAL',k[0]+m[0],k[1]+m[1],1]);rows.push(['','Selisih (Aset - Pasiva)',a[0]-k[0]-m[0],a[1]-k[1]-m[1],1])}
else{const mk=y=>sum(S.coa.filter(a=>tp(a.kode)==3).map(a=>-saOf(a.kode,y))),mv=y=>sum(S.coa.filter(a=>tp(a.kode)==3).map(a=>-act(a.kode,y))),lb=y=>sum(S.coa.filter(a=>tp(a.kode)>3).map(a=>-act(a.kode,y)));
const c=[mk(Y),mv(Y),lb(Y)];rows=[['','Modal awal tahun',c[0],'',1],['','Tambah/kurang modal (jurnal akun 3xxx)',c[1],'',1],['','Laba (rugi) tahun berjalan',c[2],'',1],['','MODAL AKHIR',sum(c),'',1]];
S.coa.filter(a=>tp(a.kode)==3).forEach(a=>rows.push([a.kode,a.nama,-bal(a.kode,Y),'']));}
return{rows,src,hasPrev:kind!='pm',title:{lr:'Laporan Laba Rugi',nr:'Neraca',pm:'Laporan Perubahan Modal'}[kind]}}
function repHTML(kind){const r=rep(kind);return`<div class="k">Pembanding tahun lalu: ${r.hasPrev?'dari '+r.src:'-'}</div><table><tr><th>Kode</th><th>Akun</th><th class="n">${Y}</th>${r.hasPrev?`<th class="n">${Y-1}</th>`:''}</tr>${r.rows.map(x=>`<tr class="${x[4]?'b':''}"><td>${x[0]}</td><td>${x[1]}</td><td class="n">${fmt(x[2])}</td>${r.hasPrev?`<td class="n">${fmt(x[3])}</td>`:''}</tr>`).join('')}</table>`}
function expX(k){const r=rep(k),a=[['PT Prima Anugerah Makmur'],[r.title+' '+Y],[],['Kode','Akun',Y,...(r.hasPrev?[Y-1]:[])],...r.rows.map(x=>[x[0],x[1],x[2],...(r.hasPrev?[x[3]]:[])])],w=XLSX.utils.book_new();XLSX.utils.book_append_sheet(w,XLSX.utils.aoa_to_sheet(a),'Laporan');XLSX.writeFile(w,r.title+' '+Y+'.xlsx')}
function expP(k){const r=rep(k),d=new jspdf.jsPDF({format:'a4',unit:'mm'});d.setFontSize(12);d.text('PT Prima Anugerah Makmur',105,12,{align:'center'});d.text(r.title+' Tahun '+Y,105,18,{align:'center'});
d.autoTable({startY:22,margin:10,head:[['Kode','Akun',String(Y),...(r.hasPrev?[String(Y-1)]:[])]],body:r.rows.map(x=>[x[0],x[1],fmt(x[2]),...(r.hasPrev?[fmt(x[3])]:[])]),styles:{fontSize:8},columnStyles:{2:{halign:'right'},3:{halign:'right'}},didParseCell:h=>{if(h.section=='body'&&r.rows[h.row.index][4])h.cell.styles.fontStyle='bold'}});d.save(r.title+' '+Y+'.pdf')}
// ===== import/template =====
function tpl(n,h,ex){const w=XLSX.utils.book_new();XLSX.utils.book_append_sheet(w,XLSX.utils.aoa_to_sheet([h,...ex]),'Template');XLSX.writeFile(w,n+'.xlsx')}
function imp(e,cb){const f=e.target.files[0];if(!f)return;f.arrayBuffer().then(b=>{const w=XLSX.read(b);cb(XLSX.utils.sheet_to_json(w.Sheets[w.SheetNames[0]],{defval:''}));e.target.value=''})}
const num=v=>+String(v).replace(/[^0-9.-]/g,'')||0;
function ensureCoa(k,n,nm){k=String(k);if(k&&!S.coa.find(a=>a.kode==k))S.coa.push({kode:k,nama:n||k,nm:nm||'d'})}
// ===== halaman =====
const NAV=[['dash','Dashboard'],['coa','Akun (COA)'],['sa','Saldo Awal'],['jr','Jurnal'],['bb','Buku Besar'],['pj','Penjualan'],['as','Aset Tetap'],['kap','Kapitalisasi'],['lap','Laporan'],['set','Pengaturan']];
function go(p){P=p;$('nav').innerHTML='<h1>🌴 ERP Sawit</h1>'+NAV.map(n=>`<a class="${n[0]==p?'on':''}" onclick="go('${n[0]}')">${n[1]}</a>`).join('')+'<a href="https://kososon.github.io/invoicepam/" target="_blank" rel="noopener">Invoice PAM ↗</a>';$('ttl').textContent=NAV.find(n=>n[0]==p)[1];
$('yr').innerHTML=[Y-3,Y-2,Y-1,Y,Y+1].map(y=>`<option ${y==Y?'selected':''}>${y}</option>`).join('');$('c').innerHTML=PG[p]()}
const opt=(f)=>codes().filter(f||(()=>1)).map(k=>`<option value="${k}">${k} - ${coaOf(k).nama}</option>`).join('');
const PG={
dash(){const pj=sum(S.coa.filter(a=>tp(a.kode)==4).map(a=>sg(a.kode,act(a.kode,Y)))),bi=sum(S.coa.filter(a=>tp(a.kode)>4).map(a=>sg(a.kode,act(a.kode,Y)))),as=sum(S.coa.filter(a=>tp(a.kode)==1).map(a=>sg(a.kode,bal(a.kode,Y))));
return`<div class="grid">${[['Total Aset',as],['Pendapatan '+Y,pj],['Biaya '+Y,bi],['Laba '+Y,pj-bi],['Piutang',sg(S.set.piutang,bal(S.set.piutang,Y))]].map(x=>`<div class="card"><div class="k">${x[0]}</div><div class="v">${fmt(x[1])}</div></div>`).join('')}</div><div class="card">Jurnal manual: ${S.jr.filter(j=>inYear(j.tgl,Y)).length} · Invoice tersinkron: ${S.inv.length} · Aset: ${S.aset.length}</div>`},
coa(){return`<div class="card"><div class="row"><input id="ck" placeholder="Kode"><input id="cn" placeholder="Nama akun"><select id="cm"><option value="d">Normal Debit</option><option value="k">Normal Kredit</option></select><button onclick="S.coa.push({kode:ck.value,nama:cn.value,nm:cm.value});save();go('coa')">Tambah</button></div>
<div class="k">Digit pertama: 1 Aset, 2 Kewajiban, 3 Modal, 4 Pendapatan, 5-6 Biaya</div><table><tr><th>Kode</th><th>Nama</th><th>Normal</th><th></th></tr>${[...S.coa].sort((a,b)=>a.kode.localeCompare(b.kode)).map(a=>`<tr><td>${a.kode}</td><td>${a.nama}</td><td>${a.nm=='d'?'Debit':'Kredit'}</td><td><button class="r" onclick="S.coa=S.coa.filter(x=>x.kode!='${a.kode}');save();go('coa')">Hapus</button></td></tr>`).join('')}</table></div>`},
sa(){const r=codes(),d=sum(r.map(k=>+(S.sa[Y]||{})[k]?.d||0)),c=sum(r.map(k=>+(S.sa[Y]||{})[k]?.k||0)),pb=S.pb[Y]||{},sp=sum(Object.values(pb).map(Number)),pa=saOf(S.set.piutang,Y);
return`<div class="card"><div class="row"><button class="g" onclick="tpl('template-saldo-awal',['kode','nama','debit','kredit'],[['1110','Kas',1000000,0],['3110','Modal Disetor',0,1000000]])">Template saldo awal</button><label>Impor ${Y}: <input type="file" accept=".xlsx,.xls,.csv" onchange="imp(event,rs=>{S.sa[Y]={};rs.forEach(x=>{ensureCoa(x.kode,x.nama,num(x.kredit)>num(x.debit)?'k':'d');S.sa[Y][String(x.kode)]={d:num(x.debit),k:num(x.kredit)}});save();go('sa')})"></label></div>
<div class="${d==c?'ok':'bad'}">Debit ${fmt(d)} · Kredit ${fmt(c)} · ${d==c?'Seimbang':'TIDAK seimbang'}</div>
<table><tr><th>Kode</th><th>Akun</th><th>Debit</th><th>Kredit</th></tr>${[...r].map(k=>{const x=(S.sa[Y]||{})[k]||{};return`<tr><td>${k}</td><td>${coaOf(k).nama}</td><td><input size=12 value="${x.d||0}" onchange="sv('${k}','d',this.value)"></td><td><input size=12 value="${x.k||0}" onchange="sv('${k}','k',this.value)"></td></tr>`}).join('')}</table></div>
<div class="card"><b>Saldo awal piutang per pembeli ${Y}</b><div class="row"><input id="pn" placeholder="Nama pembeli"><input id="pv" placeholder="Nilai"><button onclick="(S.pb[Y]=S.pb[Y]||{})[pn.value]=num(pv.value);save();go('sa')">Simpan</button></div>
<table>${Object.entries(pb).map(([n,v])=>`<tr><td>${n}</td><td class="n">${fmt(v)}</td><td><button class="r" onclick="delete S.pb[Y]['${n.replace(/'/g,"\\'")}'];save();go('sa')">x</button></td></tr>`).join('')}</table>
<div class="${sp==pa?'ok':'bad'}">Total pembeli ${fmt(sp)} vs saldo awal akun piutang ${fmt(pa)} · ${sp==pa?'COCOK':'Selisih '+fmt(sp-pa)}</div></div>`},
jr(){const L=window.ed||{id:'',tgl:Y+'-01-31',ket:'',lines:[{k:'',d:0,c:0},{k:'',d:0,c:0}]};window.ed=L;
return`<div class="card"><div class="row"><input type="date" id="jt" value="${L.tgl}"><input id="jk" size=40 placeholder="Keterangan" value="${L.ket}"></div>
<table>${L.lines.map((l,i)=>`<tr><td><select onchange="ed.lines[${i}].k=this.value"><option value="">-pilih-</option>${opt().replace(`value="${l.k}"`,`value="${l.k}" selected`)}</select></td><td><input size=12 value="${l.d}" onchange="ed.lines[${i}].d=num(this.value)"></td><td><input size=12 value="${l.c}" onchange="ed.lines[${i}].c=num(this.value)"></td><td><input size=14 placeholder="pembeli (utk piutang)" value="${l.p||''}" onchange="ed.lines[${i}].p=this.value"></td></tr>`).join('')}</table>
<div class="row"><button class="g" onclick="ed.tgl=jt.value;ed.ket=jk.value;ed.lines.push({k:'',d:0,c:0});go('jr')">+ Baris</button><button onclick="svJ()">Simpan jurnal</button><button class="g" onclick="ed=null;go('jr')">Baru</button></div></div>
<div class="card"><table><tr><th>Tgl</th><th>Keterangan</th><th class="n">Debit</th><th></th></tr>${allJr(Y).map(j=>`<tr><td>${j.tgl}</td><td>${j.ket}${j.auto?' 🔒':''}</td><td class="n">${fmt(sum(j.lines.map(l=>+l.d||0)))}</td><td>${j.auto?'':`<button class="g" onclick="ed=JSON.parse(JSON.stringify(S.jr.find(x=>x.id=='${j.id}')));go('jr')">Edit</button> <button class="r" onclick="if(confirm('Hapus jurnal?')){S.jr=S.jr.filter(x=>x.id!='${j.id}');save();go('jr')}">Hapus</button>`}</td></tr>`).join('')}</table></div>`},
bb(){const k=window.ba||codes()[0],rows=[];let s=saOf(k,Y);rows.push(['','Saldo awal','','',s]);allJr(Y).forEach(j=>j.lines.filter(l=>l.k==k).forEach(l=>{s+=(+l.d||0)-(+l.c||0);rows.push([j.tgl,j.ket,+l.d||0,+l.c||0,s])}));
const bs=[...new Set([...Object.keys(S.pb[Y]||{}),...S.inv.filter(i=>inYear(i.tanggal,Y)).map(i=>i.pembeli)])],pm=window.bp||bs[0],pr=[];let ps=+(S.pb[Y]||{})[pm]||0;pr.push(['','Saldo awal',0,0,ps]);
S.inv.filter(i=>i.pembeli==pm&&inYear(i.tanggal,Y)).forEach(i=>{const v=(+i.dpp||0)+(+i.ppn||0)-(+i.pph22||0);ps+=v;pr.push([i.tanggal,'Invoice '+(i.noInvoice||i.id),v,0,ps])});
S.jr.filter(j=>inYear(j.tgl,Y)).forEach(j=>j.lines.filter(l=>l.k==S.set.piutang&&l.p==pm).forEach(l=>{ps+=(+l.d||0)-(+l.c||0);pr.push([j.tgl,j.ket,+l.d||0,+l.c||0,ps])}));
const T=r=>`<table><tr><th>Tgl</th><th>Ket</th><th class="n">Debit</th><th class="n">Kredit</th><th class="n">Saldo</th></tr>${r.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td class="n">${fmt(x[2])}</td><td class="n">${fmt(x[3])}</td><td class="n">${fmt(x[4])}</td></tr>`).join('')}</table>`;
return`<div class="card"><select onchange="ba=this.value;go('bb')">${opt().replace(`value="${k}"`,`value="${k}" selected`)}</select>${T(rows)}</div><div class="card"><b>Buku besar piutang per pembeli</b><br><select onchange="bp=this.value;go('bb')">${bs.map(b=>`<option ${b==pm?'selected':''}>${b}</option>`)}</select>${T(pr)}</div>`},
pj(){return`<div class="card"><div class="k">Invoice dibaca realtime dari koleksi Firestore "invoices". Satu jurnal otomatis per invoice sesuai tanggal invoice; bila invoice diubah atau dihapus di web invoice, jurnal ikut berubah.</div><table><tr><th>Tgl</th><th>No</th><th>Pembeli</th><th class="n">DPP</th><th class="n">PPN</th><th class="n">PPh22</th></tr>${S.inv.filter(i=>inYear(i.tanggal,Y)).sort((a,b)=>a.tanggal.localeCompare(b.tanggal)).map(i=>`<tr><td>${i.tanggal}</td><td>${i.noInvoice||i.id}</td><td>${i.pembeli}</td><td class="n">${fmt(i.dpp)}</td><td class="n">${fmt(i.ppn)}</td><td class="n">${fmt(i.pph22)}</td></tr>`).join('')}</table></div>
<div class="card"><b>Jurnal otomatis ${Y}</b><table>${autoJr(Y).map(j=>`<tr><td>${j.tgl}</td><td>${j.ket}</td><td>${j.lines.map(l=>(l.d?'D ':'K ')+coaOf(l.k).nama+' '+fmt(l.d||l.c)).join(' | ')}</td></tr>`).join('')}</table></div>`},
as(){const gs=[...new Set(S.aset.map(a=>a.kelompok))];

const dep=a=>{if(a.off)return 0;if(!a.tgl||+a.tgl.slice(0,4)>Y)return 0;return Math.max(0,Math.min(a.harga/a.umur,a.harga-a.akum))};
function peny(){const g={};S.aset.forEach(a=>{const m=S.map[a.kelompok]||{};if(!m.k)return;g[m.k]=(g[m.k]||0)+dep(a)});const l=[];Object.entries(g).forEach(([k,v])=>{if(v){l.push({k:S.set.beban,d:v,c:0});l.push({k,d:0,c:v})}});if(!l.length)return alert('Pilih akun akumulasi per kelompok dulu');
S.jr=S.jr.filter(j=>j.id!='PNY-'+Y);S.jr.push({id:'PNY-'+Y,tgl:Y+'-12-31',ket:'Penyusutan aset tahun '+Y,lines:l});save();alert('Jurnal penyusutan dibuat/diperbarui');go('as')}
function kapit(){const v=num($('kn').value);if(!v)return;const id='KAP'+Date.now();S.jr.push({id,kap:1,tgl:$('kt').value,ket:'Kapitalisasi: '+$('kk').value,lines:[{k:$('ka').value,d:v,c:0},{k:$('kb').value,d:0,c:v}]});

const noOf=j=>j.no||j.id;

PG.jr=function(){const L=window.ed||{id:'',no:'',tgl:Y+'-01-31',ket:'',lines:[{k:'',d:0,c:0},{k:'',d:0,c:0}]};window.ed=L;
return`<div class="card"><div class="row"><b>${L.no||'No. Trx otomatis'}</b><input type="date" id="jt" value="${L.tgl}"><input id="jk" size=40 placeholder="Keterangan" value="${L.ket}"></div>
<table>${L.lines.map((l,i)=>`<tr><td><select onchange="ed.lines[${i}].k=this.value"><option value="">-pilih-</option>${opt().replace(`value="${l.k}"`,`value="${l.k}" selected`)}</select></td><td><input size=12 value="${l.d}" onchange="ed.lines[${i}].d=num(this.value)"></td><td><input size=12 value="${l.c}" onchange="ed.lines[${i}].c=num(this.value)"></td><td><input size=14 placeholder="pembeli (utk piutang)" value="${l.p||''}" onchange="ed.lines[${i}].p=this.value"></td></tr>`).join('')}</table>
<div class="row"><button class="g" onclick="ed.tgl=jt.value;ed.ket=jk.value;ed.lines.push({k:'',d:0,c:0});go('jr')">+ Baris</button><button onclick="svJ()">Simpan jurnal</button><button class="g" onclick="ed=null;go('jr')">Baru</button></div></div>
<div class="card"><table><tr><th>No Trx</th><th>Tgl</th><th>Keterangan</th><th class="n">Nilai</th><th>Status</th><th></th></tr>${allJr(Y,1).map(j=>`<tr style="${j.void?'opacity:.55':''}"><td>${noOf(j)}</td><td>${j.tgl}</td><td style="${j.void?'text-decoration:line-through':''}">${j.ket}${j.auto?' 🔒':''}</td><td class="n">${fmt(sum(j.lines.map(l=>+l.d||0)))}</td><td>${j.void?'<span class="bad">Batal</span>':'Aktif'}</td><td>${j.auto?'':`<button class="g" onclick="ed=JSON.parse(JSON.stringify(S.jr.find(x=>x.id=='${j.id}')));go('jr')">Edit</button> `}<button class="g" onclick="balik('${j.id}')">Balik</button> <button class="${j.void?'':'r'}" onclick="tv('${j.id}')">${j.void?'Aktifkan':'Batalkan'}</button>${j.auto?'':` <button class="r" onclick="if(confirm('Hapus permanen?')){S.jr=S.jr.filter(x=>x.id!='${j.id}');save();go('jr')}">Hapus</button>`}</td></tr>`).join('')}</table><div class="k">Batalkan = saldo kembali seperti sebelum jurnal (bisa diaktifkan lagi). Balik = buat jurnal pembalik (D/K ditukar). 🔒 = jurnal penjualan otomatis, ubah lewat invoice.</div></div>`};
function svJ(){const L=window.ed;L.tgl=$('jt').value;L.ket=$('jk').value;L.lines=L.lines.filter(l=>l.k);const d=sum(L.lines.map(l=>+l.d||0)),c=sum(L.lines.map(l=>+l.c||0));if(!L.lines.length||d!=c||!d)return alert('Debit harus sama dengan kredit dan tidak nol ('+fmt(d)+' vs '+fmt(c)+')');
if(L.id)S.jr=S.jr.map(x=>x.id==L.id?L:x);else{L.id='J'+Date.now();L.no=nextNo(L.tgl.slice(0,4));S.jr.push(L)}window.ed=null;save();go('jr')}
function balik(id){const j=allJr(Y,1).find(x=>x.id==id);if(!j)return;const y=+j.tgl.slice(0,4),m=+j.tgl.slice(5,7),def=y+'-12-31',tg=prompt('Tanggal jurnal pembalik (YYYY-MM-DD):',def);if(!tg)return;
S.jr.push({id:'J'+Date.now(),no:nextNo(tg.slice(0,4)),tgl:tg,ket:'Pembalik '+noOf(j)+' - '+j.ket,ref:noOf(j),lines:j.lines.map(l=>({k:l.k,d:+l.c||0,c:+l.d||0,p:l.p}))});save();go('jr')}
function tv(id){const j=allJr(Y,1).find(x=>x.id==id);if(!j)return;const v=!j.void;if(!confirm((v?'Batalkan ':'Aktifkan kembali ')+noOf(j)+'?'))return;
if(id.startsWith('AUTO-')){S.vd=S.vd||[];S.vd=v?[...S.vd,id]:S.vd.filter(x=>x!=id)}else{S.jr.find(z=>z.id==id).void=v;S.aset.forEach(a=>{if(a.kode==id)a.off=v})}save();go('jr')}
function bbD(){const k=window.ba||codes()[0],R=[];let s=saOf(k,Y);R.push(['','','Saldo awal',0,0,s]);allJr(Y).forEach(j=>j.lines.filter(l=>l.k==k).forEach(l=>{s+=(+l.d||0)-(+l.c||0);R.push([j.tgl,noOf(j),j.ket,+l.d||0,+l.c||0,s])}));
const vd=S.vd||[],iv=S.inv.filter(i=>inYear(i.tanggal,Y)&&!vd.includes('AUTO-'+i.id)),bs=[...new Set([...Object.keys(S.pb[Y]||{}),...iv.map(i=>i.pembeli)])].sort(),pm=bs.includes(window.bp)?window.bp:bs[0],ev=[];
iv.filter(i=>i.pembeli==pm).forEach(i=>ev.push([i.tanggal,'JP-'+(i.noInvoice||i.id),'Invoice '+(i.noInvoice||i.id),(+i.dpp||0)+(+i.ppn||0)-(+i.pph22||0),0]));
S.jr.filter(j=>!j.void&&inYear(j.tgl,Y)).forEach(j=>j.lines.filter(l=>l.k==S.set.piutang&&l.p==pm).forEach(l=>ev.push([j.tgl,noOf(j),j.ket,+l.d||0,+l.c||0])));
let ps=+(S.pb[Y]||{})[pm]||0;const P_=[['','','Saldo awal',0,0,ps]];ev.sort((a,b)=>a[0].localeCompare(b[0])).forEach(e=>{ps+=e[3]-e[4];P_.push([...e,ps])});return{k,R,bs,pm,P_}}
PG.bb=function(){const D=bbD(),T=r=>`<table><tr><th>Tgl</th><th>No Trx</th><th>Ket</th><th class="n">Debit</th><th class="n">Kredit</th><th class="n">Saldo</th></tr>${r.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td class="n">${fmt(x[3])}</td><td class="n">${fmt(x[4])}</td><td class="n">${fmt(x[5])}</td></tr>`).join('')}</table>`;
return`<div class="card"><div class="row"><select onchange="ba=this.value;go('bb')">${opt().replace(`value="${D.k}"`,`value="${D.k}" selected`)}</select><button class="g" onclick="expBB('a')">PDF</button><button class="g" onclick="expBBx('a')">Excel</button></div>${T(D.R)}</div>
<div class="card"><b>Buku besar piutang per pembeli</b><div class="row"><select onchange="bp=this.value;go('bb')">${D.bs.map(b=>`<option ${b==D.pm?'selected':''}>${b}</option>`).join('')}</select><button class="g" onclick="expBB('p')">PDF</button><button class="g" onclick="expBBx('p')">Excel</button></div>${T(D.P_)}</div>`};
function expBB(w){const D=bbD(),R=w=='a'?D.R:D.P_,t=w=='a'?'Buku Besar '+D.k+' '+coaOf(D.k).nama:'Buku Besar Piutang '+D.pm,d=new jspdf.jsPDF({format:'a4',unit:'mm'});d.setFontSize(12);d.text('PT Prima Anugerah Makmur',105,12,{align:'center'});d.text(t+' Tahun '+Y,105,18,{align:'center'});
d.autoTable({startY:22,margin:{top:10,left:10,right:10,bottom:12},head:[['Tgl','No Trx','Keterangan','Debit','Kredit','Saldo']],body:R.map(x=>[x[0],x[1],x[2],fmt(x[3]),fmt(x[4]),fmt(x[5])]),styles:{fontSize:8},columnStyles:{3:{halign:'right'},4:{halign:'right'},5:{halign:'right'}}});
const n=d.getNumberOfPages();for(let i=1;i<=n;i++){d.setPage(i);d.setFontSize(8);d.text(i+'/'+n,105,291,{align:'center'})}d.save(t+' '+Y+'.pdf')}
function expBBx(w){const D=bbD(),R=w=='a'?D.R:D.P_,x=XLSX.utils.book_new();XLSX.utils.book_append_sheet(x,XLSX.utils.aoa_to_sheet([['Tgl','No Trx','Keterangan','Debit','Kredit','Saldo'],...R]),'Buku Besar');XLSX.writeFile(x,'Buku Besar '+Y+'.xlsx')}
function pdfRep(ks,s0,name){let d,pn={},c=s0;ks.forEach(k=>{const r=rep(k),o=k=='nr'?'l':'p';if(!d)d=new jspdf.jsPDF({format:'a4',unit:'mm',orientation:o});else d.addPage('a4',o);const W=d.internal.pageSize.getWidth(),st=d.getNumberOfPages();d.setFontSize(12);d.text('PT Prima Anugerah Makmur',W/2,12,{align:'center'});d.text(r.title+' Tahun '+Y,W/2,18,{align:'center'});
d.autoTable({startY:22,margin:{top:10,left:10,right:10,bottom:12},head:[['Kode','Akun',String(Y),...(r.hasPrev?[String(Y-1)]:[])]],body:r.rows.map(x=>[x[0],x[1],fmt(x[2]),...(r.hasPrev?[fmt(x[3])]:[])]),styles:{fontSize:8},columnStyles:{2:{halign:'right'},3:{halign:'right'}},didParseCell:h=>{if(h.section=='body'&&r.rows[h.row.index][4])h.cell.styles.fontStyle='bold'}});for(let i=st;i<=d.getNumberOfPages();i++)pn[i]=c++});
for(const i in pn){d.setPage(+i);const W=d.internal.pageSize.getWidth(),H=d.internal.pageSize.getHeight();d.setFontSize(9);d.text('Halaman '+pn[i],W/2,H-5,{align:'center'})}d.save(name)}
function expP(k){pdfRep([k],{nr:1,lr:2,pm:3}[k],rep(k).title+' '+Y+'.pdf')}

const _lap=PG.lap;PG.lap=()=>_lap().replace('<button class="g" onclick="expX(','<button class="g" onclick="expAll()">PDF semua (hal 1-3)</button><button class="g" onclick="expX(');
const _pj=PG.pj;PG.pj=()=>'<div class="row"><a href="https://kososon.github.io/invoicepam/" target="_blank" rel="noopener"><button>Buka Invoice PAM ↗</button></a></div>'+_pj();
const _set=PG.set;PG.set=()=>_set()+`<div class="card"><b>Backup data</b><div class="row"><button onclick="backup()">Backup sekarang (unduh JSON)</button><label>Restore: <input type="file" accept=".json" onchange="restore(event)"></label></div></div>`;
function tutup(){const t=$('tg').value;if(!t)return alert('Pilih akun modal (3xxx) tujuan');const L=[];let net=0;S.coa.filter(a=>tp(a.kode)>3).sort((a,b)=>a.kode.localeCompare(b.kode)).forEach(a=>{const v=act(a.kode,Y);if(!v)return;L.push({k:a.kode,d:v<0?-v:0,c:v>0?v:0});net-=v});
if(!L.length)return alert('Belum ada transaksi pendapatan/biaya');L.push({k:t,d:net<0?-net:0,c:net>0?net:0});S.jr=S.jr.filter(j=>j.id!='TUTUP-'+Y);S.jr.push({id:'TUTUP-'+Y,no:'JT-'+Y,tutup:1,tgl:Y+'-12-31',ket:'Jurnal penutup laba/rugi '+Y,lines:L});save();go('jr')}
const _jr=PG.jr;PG.jr=()=>_jr()+`<div class="card"><b>Jurnal penutup ${Y} (31 Des)</b><div class="row"><select id="tg"><option value="">- pilih akun modal 3xxx tujuan -</option>${opt(k=>tp(k)==3)}</select><button onclick="tutup()">1. Buat jurnal penutup</button><button class="g" onclick="lanjut()">2. Buat saldo awal ${Y+1}</button></div><div class="k">Menutup akun pendapatan dan biaya ke akun tujuan. Laporan laba rugi tidak terpengaruh. Langkah 2 membawa saldo akhir akun neraca (termasuk laba ditahan) dan saldo piutang per pembeli menjadi saldo awal tahun berikutnya; akun laba rugi mulai dari nol. Bisa dibatalkan dari daftar jurnal.</div></div>`;
function balT(k,y){return saOf(k,y)+sum(allJr(y).flatMap(j=>j.lines.filter(l=>l.k==k).map(l=>(+l.d||0)-(+l.c||0))))}
function pbEnd(y){const r={...(S.pb[y]||{})},vd=S.vd||[];Object.keys(r).forEach(k=>r[k]=+r[k]||0);S.inv.filter(i=>inYear(i.tanggal,y)&&!vd.includes('AUTO-'+i.id)).forEach(i=>{r[i.pembeli]=(r[i.pembeli]||0)+(+i.dpp||0)+(+i.ppn||0)-(+i.pph22||0)});S.jr.filter(j=>!j.void&&inYear(j.tgl,y)).forEach(j=>j.lines.filter(l=>l.k==S.set.piutang&&l.p).forEach(l=>{r[l.p]=(r[l.p]||0)+(+l.d||0)-(+l.c||0)}));Object.keys(r).forEach(k=>{if(!Math.round(r[k]))delete r[k]});return r}
function lanjut(){if(!S.jr.find(j=>j.id=='TUTUP-'+Y&&!j.void))return alert('Buat jurnal penutup '+Y+' dulu');
if(S.coa.some(a=>tp(a.kode)>3&&Math.round(balT(a.kode,Y)))&&!confirm('Masih ada akun laba rugi bersaldo (ada transaksi setelah penutup). Sebaiknya buat ulang jurnal penutup. Lanjut tetap?'))return;
if(S.sa[Y+1]&&Object.keys(S.sa[Y+1]).length&&!confirm('Saldo awal '+(Y+1)+' sudah ada. Timpa?'))return;
const n={};S.coa.filter(a=>tp(a.kode)<=3).forEach(a=>{const v=Math.round(balT(a.kode,Y));if(v)n[a.kode]={d:v>0?v:0,k:v<0?-v:0}});S.sa[Y+1]=n;S.pb[Y+1]=pbEnd(Y);save();alert('Saldo awal '+(Y+1)+' dibuat dari saldo akhir '+Y+' (hanya akun neraca).');Y=Y+1;localStorage.y=Y;go('sa')}
if(sessionStorage.ok){$('lg').style.display='none';boot()}else $('lg').style.display='flex';
